
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Password:</label>

        <input type="password" name="password">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobby" value="Reading"> Reading
        <input type="checkbox" name="hobby" value="Sports"> Sports
        <input type="checkbox" name="hobby" value="Music"> Music
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option>Select Course</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
        </select>
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Address:</label>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>




























































































<!DOCTYPE html>
<html>
<head>
    <title>B.Tech AI & ML Registration</title>
</head>
<body>

    <h2>B.Tech AI & ML - 4th Semester</h2>
    <h3>Student Registration Form</h3>

    <form>

        <label>Student Name:</label>
        <input type="text" name="student_name" placeholder="Enter your name" required>
        <br><br>

        <label>Roll Number:</label>
        <input type="text" name="roll_number" placeholder="Enter roll number" required>
        <br><br>

        <label>University Email:</label>
        <input type="email" name="email" placeholder="Enter email address" required>
        <br><br>

        <label>Mobile Number:</label>
        <input type="tel" name="mobile" placeholder="Enter mobile number">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option value="BTech AIML">B.Tech Artificial Intelligence & Machine Learning</option>
        </select>
        <br><br>

        <label>Semester:</label>
        <select name="semester">
            <option value="4">4th Semester</option>
        </select>
        <br><br>

        <label>Programming Languages Known:</label>
        <br>
        <input type="checkbox" name="skills" value="Python"> Python
        <input type="checkbox" name="skills" value="Java"> Java
        <input type="checkbox" name="skills" value="C"> C
        <input type="checkbox" name="skills" value="C++"> C++
        <br><br>

        <label>Address:</label>
        <br>
        <textarea name="address" rows="10" cols="20"
        placeholder="Enter your address"></textarea>
        <br><br>

        <label>Why did you choose AI & ML?</label>
        <br>
        <textarea name="reason" rows="4" cols="30"
        placeholder="Enter your response"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
